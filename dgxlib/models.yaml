# Per-model DGX request behavior registry.
#
# This is the one place that encodes how each model served on the Spark wants to
# be called. Edit it in the same breath as the spin-up-vllm-*.sh script that
# serves a model — a model swap should be a one-line change here, never code.
#
# Thinking is (model capability) x (call intent):
#   - can_think        : does this model support a reasoning/thinking template at all
#   - thinking_default : when a caller does NOT specify, think or not?
# A call site may override with thinking=True/False; the override is honored only
# if can_think is true, otherwise thinking is forced off.
#
# Keys are the exact model id advertised by GET /v1/models (what vLLM serves).
# `match` entries are prefix fallbacks used when no exact id matches.
# Unknown models fall through to `default`.
#
# Timeouts: the client STREAMS, so the active budget is `idle_timeout` — the max
# seconds with no token streamed (covers both queue admission and inter-token
# stalls). A slow-but-steady generation that keeps emitting tokens is never
# killed by it (only max_tokens bounds total length). `read_timeout` is the
# legacy total-response budget, kept for back-compat and as the default for
# idle_timeout when a model omits it. Set idle_timeout small to fail dead/queued
# slots fast; keep it large only where queue admission is legitimately long.

default:
  can_think: false
  thinking_default: false
  read_timeout: 300        # seconds; legacy total-response budget (back-compat)
  idle_timeout: 120        # seconds with no streamed token -> fail fast
  max_tokens: 16384        # generous floor; reasoning models can burn a lot

models:
  "Qwen/Qwen3.5-122B-A10B-FP8":
    # Cross-box TP=2 on the Spark: ~20 tok/s single-stream, slower under
    # concurrent load. A full 20k-token completion (pdf-translators' budget)
    # legitimately needs >10 min. Under heavy batch load (max-num-seqs=35
    # saturated), a request can wait in vLLM's queue up to ~800s before even
    # starting, then another ~800s to generate — total >1200s. 1h covers the
    # worst case without masking true outages (connection errors are immediate).
    # Streaming makes read_timeout mostly moot, but this box can sit ~800s in the
    # queue before its first token, so keep a generous idle budget: only a slot
    # that's truly dead (no token for 15 min) should be failed here.
    can_think: true
    thinking_default: false
    read_timeout: 3600
    idle_timeout: 900

  "Qwen/Qwen3-Next-80B-A3B-Instruct-FP8":
    # A3B (3B active) streams quickly once admitted. 300s covers the ~2-minute
    # cold-start window at batch startup (vLLM warms up before the first token
    # flows); anything beyond that is a truly wedged or dead slot. 120s was too
    # tight and killed the first wave of chunks on every fresh run.
    can_think: true
    thinking_default: false
    read_timeout: 600
    idle_timeout: 300

  "deepseek-ai/DeepSeek-V4-Flash-DSpark":
    # 284B total / 13B active FP4-expert + FP8-dense hybrid, served CROSS-BOX
    # (spark1 head + spark2 worker, TP=2, mp backend) 2026-07-30 -> 2026-08-04,
    # then upgraded to the -0731 checkpoint below. Kept here (not deleted) as
    # the revert target — MODEL=... SPEC_TOKENS=3 still boots this checkpoint
    # from the HF cache without a re-download.
    # Measured single-stream decode ~30 tok/s — slower than the single-box
    # Qwen3-Next-80B it displaced, so give it a wider budget than that model.
    # Cold prefill is ~1,000-1,200 tok/s, so a large read-heavy prompt spends
    # real time before the first token: a 128K prompt is ~2 min of prefill with
    # nothing streamed yet. idle_timeout must cover that whole cold-prefill
    # window or long-context calls die before their first token.
    # can_think: the checkpoint has a reasoning path, but note this build emits
    # `reasoning` (NOT `reasoning_content`) — the shape that silently drops
    # traces in opencode. Default thinking OFF until that's re-verified.
    can_think: true
    thinking_default: false
    read_timeout: 1800
    idle_timeout: 420

  "deepseek-ai/DeepSeek-V4-Flash-0731":
    # DeepSeek's official V4-Flash release (2026-07-31), upgraded onto the
    # same cross-box slot 2026-08-04, displacing the DSpark preview above.
    # Byte-identical architecture/quant format to the preview (284B/13B
    # active, fp8/e4m3/ue8m0, dspark_block_size 5) -- a retrain, not a new
    # architecture -- so the preview's timing budget carries over unchanged:
    # same cold-prefill shape (~1,000-1,200 tok/s), same reason a 128K prompt
    # needs idle_timeout to cover ~2 min of silent prefill before the first
    # token. Single-stream decode sanity-checked at ~21-31 tok/s (noisy,
    # 3-run spot check, not a controlled A/B) -- comparable to the preview's
    # 30.3 tok/s point measurement, no gross regression.
    # can_think: same caveat as the preview carried over unverified for 0731
    # specifically -- reasoning path exists but reasoning/reasoning_content
    # framing not re-checked on this checkpoint. Default thinking OFF.
    can_think: true
    thinking_default: false
    read_timeout: 1800
    idle_timeout: 420

  "qwen3.8-flash-next":
    # Matches the served vLLM --max-num-seqs on each DGX endpoint.
    max_concurrency: 8
    # Qwen3.8-Flash-Next on spark1 AND spark2 (2026-09-10), single-box on each,
    # NVFP4 routed experts + blockwise-fp8 side layers ("hybrid"), 262K native
    # ctx, MTP-2, APC on. Served via the blazux recipe (~/qwen3.8-Flash-DGX on
    # each box). Both boxes run the same image and a byte-identical checkpoint,
    # so this ONE entry covers both endpoints — the registry keys on the served
    # id, not the host, and the id is the same on 192.168.1.147:8001 and
    # 192.168.1.121:8001.
    #
    # ⚠ The served id is LOWERCASE and does NOT match the "Qwen/Qwen3" prefix
    # entry under `match:` below (startswith is case-sensitive — see
    # registry.py:93). Without this explicit entry it falls through to
    # `default` at idle_timeout 120, which kills long-context calls during
    # prefill. Verified by resolve_model_config() before this entry existed.
    #
    # Timeouts: measured cold prefill ~1,140 tok/s with a COLD PLE page cache
    # (the 47.7 GiB n-gram table is mmapped from NVMe; a first pass over a cold
    # region is 2-3x slower than warm). A full 262K prompt is therefore ~4 min
    # of silent prefill worst case before the first token streams, so idle must
    # cover that whole window — same reasoning as the DSpark entry above, not a
    # guess carried over from it.
    #
    # can_think: TRUE — the slot runs --reasoning-parser qwen3 and the model
    # emits real reasoning traces, ON BY DEFAULT.
    # ⚠ This build populates `reasoning` and leaves `reasoning_content` NULL —
    # the same shape as the nano_v3 / DeepSeek-R1 parsers that opencode and
    # openclaw silently drop (memory `todo_nano_v3_reasoning_leak`). Traces are
    # billed against completion_tokens either way: measured 24 of 28 completion
    # tokens (86%) on a trivial "Reply with exactly: OK".
    # THE SUPPRESSION SWITCH IS `chat_template_kwargs: {"enable_thinking": false}`
    # (verified 2026-09-10: 28 tok -> 2 tok, reasoning_tokens 24 -> 0), which is
    # exactly what thinking_default: false emits via extra_body — so dgxlib
    # consumers are already correct. ⚠ `/no_think` in the prompt does NOT work
    # on this model: it is echoed into the answer verbatim and the trace still
    # fires (41 completion tok, 33 reasoning). Do not use it, despite the
    # upstream recipe's smoke-test.sh doing so.
    can_think: true
    thinking_default: false
    read_timeout: 1800
    idle_timeout: 420

  "Qwen/Qwen2.5-14B-Instruct-AWQ":
    can_think: false
    thinking_default: false

  "inclusionAI/Ling-lite":
    # 16.8B total / ~2.75B active full-attention MoE on spark1 (2026-06-25,
    # experimental swap off the 80B). NOT a reasoning model — the Ring line is
    # the thinking sibling; Ling-lite emits plain content (verified reasoning:null,
    # no <think> leak). Fewer active params than the 80B → streams fast once
    # admitted, so the 80B's 120s idle budget is plenty. NOTE: served at 32K
    # native context (the card's 128K needs YaRN, not enabled in this checkpoint).
    can_think: false
    thinking_default: false
    read_timeout: 600
    idle_timeout: 120

match:
  # Prefix fallbacks (longest match wins) for slots whose exact id isn't listed.
  "Qwen/Qwen3":
    can_think: true
    thinking_default: false
    read_timeout: 600
    idle_timeout: 120
